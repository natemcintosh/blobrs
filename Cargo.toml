[package]
name = "blobrs"
version = "0.5.0"
description = "TUI for interacting with blob storage"
authors = ["Nate McIntosh <natemcintosh@gmail.com>"]
license = "MIT"
repository = "https://github.com/natemcintosh/blobrs"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
color-eyre = "0.6.3"
object_store = { version = "0.14", features = ["azure"] }
tokio = { version = "1", features = ["full"] }
url = "2.5"
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
arboard = "3.6"
dirs = "7.0"
urlencoding = "2.1"
csv = "1.3"
serde_json = "1.0"
parquet = "58"
arrow = "58"
bytes = "1.11"
tempfile = "3"
tokio-util = "0.7"

[dev-dependencies]
async-trait = "0.1"
proptest = "1.11"
